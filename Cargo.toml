[package]
name = "mediafire_mini"
version = "0.3.1"
edition = "2021"
description = "Standalone Windows Material 3 GUI (Slint) for MediaFire folder & file downloads"
build = "build.rs"

[[bin]]
name = "MediaFireMini"
path = "src/main.rs"

[dependencies]
slint = "1.18"
md_downloader = "0.1.5"
tokio = { version = "1.49", features = ["rt-multi-thread", "sync", "time", "macros"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
rfd = { version = "0.15", default-features = false }
arboard = "3.4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
